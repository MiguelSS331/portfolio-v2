<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Curvas Vivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  #terrain{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #ffffff;
  }
  #grain{
    position: fixed;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: .5;
    background-repeat: repeat;
    background-size: 170px 170px;
  }
</style>

<canvas id="terrain" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  /* ================= field: two coordinate-decoupled bezier curves ================= */
  /* Ported from the "Topography" reference (react-bits): a = f(uv.x), b = f(uv.y),
     value = distance(a,b). Coefficients drift over time to morph the relief. */

  var CTRL_INDICES = [
    [1, -2, 3, -4],
    [9, -8, 7, -6],
    [5, 2, 5, -5],
    [-1, -3, 8, 9]
  ];
  var ctrlA = [0,0,0,0], ctrlB = [0,0,0,0], ctrlC = [0,0,0,0], ctrlD = [0,0,0,0];
  var ctrlArrays = [ctrlA, ctrlB, ctrlC, ctrlD];

  var MORPH_AMOUNT = 3.0;
  var SPEED = 0.15;
  var MORPH_SPEED = 0.05;
  var BANDS = 2.0;
  var LEVEL_STEP = 1 / BANDS;
  var SCALE = 1.25;
  var MOUSE_RADIUS = 0.3;
  var MOUSE_STRENGTH = 0.4;

  function updateCtrls(time){
    for (var g = 0; g < 4; g++){
      var idx = CTRL_INDICES[g];
      var arr = ctrlArrays[g];
      for (var j = 0; j < 4; j++){
        var i = idx[j];
        arr[j] = MORPH_AMOUNT * Math.sin(time * SPEED * Math.sin(i * MORPH_SPEED) + i);
      }
    }
  }

  function bez(t, c){
    var w = 6.2831853 * t;
    return 0.5 * (c[0]*Math.sin(w) + c[1]*Math.cos(w) + c[2]*Math.sin(2*w) + c[3]*Math.cos(2*w));
  }

  function field(ux, uy){
    var ax = bez(ux, ctrlA), ay = bez(ux, ctrlB);
    var bx = bez(uy, ctrlC), by = bez(uy, ctrlD);
    var dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function hash01(x,y,z){
    var h = x*374761393 + y*668265263 + z*2246822519;
    h = (h ^ (h >>> 13)) * 1274126177;
    h = h ^ (h >>> 16);
    return ((h >>> 0)) / 4294967295;
  }

  /* ================= canvas setup ================= */
  var canvas = document.getElementById('terrain');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, DPR = 1, cellSize = 14, cols = 0, rows = 0;
  var FV = null; // flat grid of field values, cols*rows
  var mouse = { x: 0.5, y: 0.5 };
  var mouseSmooth = { x: 0.5, y: 0.5 };
  var mouseActiveTarget = 0, mouseActive = 0;

  function resize(){
    W = Math.max(1, Math.round(window.innerWidth));
    H = Math.max(1, Math.round(window.innerHeight));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var targetCells = 6500;
    cellSize = Math.max(9, Math.round(Math.sqrt((W*H) / targetCells)));
    cols = Math.ceil(W / cellSize) + 1;
    rows = Math.ceil(H / cellSize) + 1;
    FV = new Float32Array(cols * rows);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
  }

  var LINE_COLOR = '#b8442a';
  var NUMBER_COLOR = 'rgba(40,78,216,ALPHA)';
  var numberGlyphs = ['0','1'];
  var NUMBER_HOVER_RADIUS = 0.22;

  function buildGrid(t){
    updateCtrls(t);
    var mx = mouseSmooth.x, my = mouseSmooth.y, aspect = W / H;
    var minV = Infinity, maxV = -Infinity;
    for (var r = 0; r < rows; r++){
      var py = r * cellSize;
      var rawY = py / H;
      var uy = (rawY - 0.5) / SCALE + 0.5;
      var rowOff = r * cols;
      for (var c = 0; c < cols; c++){
        var px = c * cellSize;
        var rawX = px / W;
        var ux = (rawX - 0.5) / SCALE + 0.5;
        var fv = field(ux, uy);
        var dxm = (rawX - mx) * aspect;
        var dym = (rawY - my);
        var bump = Math.exp(-(dxm*dxm + dym*dym) / (MOUSE_RADIUS*MOUSE_RADIUS)) * MOUSE_STRENGTH * mouseActive;
        fv += bump;
        FV[rowOff + c] = fv;
        if (fv < minV) minV = fv;
        if (fv > maxV) maxV = fv;
      }
    }
    return { min: minV, max: maxV };
  }

  /* ---- marching squares: extract iso-line segments for one level across the grid ---- */
  function traceLevel(level, ctxPath){
    for (var r = 0; r < rows - 1; r++){
      var rowOff = r * cols, rowOffNext = (r+1) * cols;
      var py0 = r * cellSize, py1 = (r+1) * cellSize;
      for (var c = 0; c < cols - 1; c++){
        var px0 = c * cellSize, px1 = (c+1) * cellSize;
        var tl = FV[rowOff + c],     tr = FV[rowOff + c + 1];
        var bl = FV[rowOffNext + c], br = FV[rowOffNext + c + 1];

        var tlAbove = tl > level, trAbove = tr > level, brAbove = br > level, blAbove = bl > level;
        if (tlAbove === trAbove && trAbove === brAbove && brAbove === blAbove) continue;

        var tx, ty, rx, ry, bx, by, lx, ly;
        var hasT = tlAbove !== trAbove, hasR = trAbove !== brAbove, hasB = blAbove !== brAbove, hasL = tlAbove !== blAbove;

        if (hasT){ tx = px0 + (px1-px0) * (level-tl)/(tr-tl); ty = py0; }
        if (hasR){ rx = px1; ry = py0 + (py1-py0) * (level-tr)/(br-tr); }
        if (hasB){ bx = px0 + (px1-px0) * (level-bl)/(br-bl); by = py1; }
        if (hasL){ lx = px0; ly = py0 + (py1-py0) * (level-tl)/(bl-tl); }

        var n = (hasT?1:0) + (hasR?1:0) + (hasB?1:0) + (hasL?1:0);
        if (n === 2){
          if (hasT && hasR){ ctxPath.moveTo(tx,ty); ctxPath.lineTo(rx,ry); }
          else if (hasT && hasB){ ctxPath.moveTo(tx,ty); ctxPath.lineTo(bx,by); }
          else if (hasT && hasL){ ctxPath.moveTo(tx,ty); ctxPath.lineTo(lx,ly); }
          else if (hasR && hasB){ ctxPath.moveTo(rx,ry); ctxPath.lineTo(bx,by); }
          else if (hasR && hasL){ ctxPath.moveTo(rx,ry); ctxPath.lineTo(lx,ly); }
          else if (hasB && hasL){ ctxPath.moveTo(bx,by); ctxPath.lineTo(lx,ly); }
        } else if (n === 4){
          var center = (tl+tr+br+bl) / 4;
          if (center > level){
            ctxPath.moveTo(tx,ty); ctxPath.lineTo(lx,ly);
            ctxPath.moveTo(rx,ry); ctxPath.lineTo(bx,by);
          } else {
            ctxPath.moveTo(tx,ty); ctxPath.lineTo(rx,ry);
            ctxPath.moveTo(lx,ly); ctxPath.lineTo(bx,by);
          }
        }
      }
    }
  }

  function render(t){
    var range = buildGrid(t);
    ctx.clearRect(0, 0, W, H);

    /* contour lines: real interpolated iso-curves, not an approximate band of glyphs */
    var startLevel = Math.ceil(range.min / LEVEL_STEP) * LEVEL_STEP;
    ctx.beginPath();
    for (var level = startLevel; level <= range.max; level += LEVEL_STEP){
      traceLevel(level, ctx);
    }
    ctx.strokeStyle = LINE_COLOR;
    ctx.lineWidth = Math.max(1, cellSize * 0.09);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    /* numbers: drawn ON the same iso-lines (band-index crossings between neighboring
       grid points), so they trace and move with the exact curves, layered on top of
       the stroke — not an independent scatter across the whole field. */
    var mx = mouseSmooth.x, my = mouseSmooth.y, aspect = W / H;
    var baseSize = cellSize * 1.05;
    var lastSizeKey = -1;

    for (var r = 0; r < rows - 1; r++){
      var rowOff = r * cols, rowOffNext = (r+1) * cols;
      var py = r * cellSize;
      var rawY = py / H;
      for (var c = 0; c < cols - 1; c++){
        var here = FV[rowOff + c];
        var bHere = Math.floor(here / LEVEL_STEP);
        var bRight = Math.floor(FV[rowOff + c + 1] / LEVEL_STEP);
        var bDown = Math.floor(FV[rowOffNext + c] / LEVEL_STEP);
        if (bHere === bRight && bHere === bDown) continue;

        var px = c * cellSize;
        var rawX = px / W;

        var dxh = (rawX - mx) * aspect, dyh = (rawY - my);
        var hoverBoost = Math.exp(-(dxh*dxh + dyh*dyh) / (NUMBER_HOVER_RADIUS*NUMBER_HOVER_RADIUS)) * mouseActive;

        var sizeKey = Math.round(hoverBoost * 8);
        if (sizeKey !== lastSizeKey){
          ctx.font = "700 " + Math.round(baseSize * (1 + sizeKey/8*0.55)) + "px 'JetBrains Mono', monospace";
          lastSizeKey = sizeKey;
        }

        var timeBucket = Math.floor((t + hash01(c, r, 0) * 20) / 30);
        var gr = hash01(c, r, timeBucket);
        var glyph = numberGlyphs[Math.floor(gr * numberGlyphs.length)];
        var alpha = 0.72 + hoverBoost * 0.28;
        ctx.fillStyle = NUMBER_COLOR.replace('ALPHA', alpha.toFixed(2));
        ctx.fillText(glyph, px, py);
      }
    }
  }

  function makeGrainDataURL(size){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var gctx = c.getContext('2d');
    var img = gctx.createImageData(size, size);
    for (var i = 0; i < img.data.length; i += 4){
      var v = Math.random() * 255;
      img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v;
      img.data[i+3] = Math.random() * 45;
    }
    gctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }
  document.getElementById('grain').style.backgroundImage = 'url(' + makeGrainDataURL(160) + ')';

  window.addEventListener('pointermove', function(ev){
    mouse.x = ev.clientX / W;
    mouse.y = ev.clientY / H;
    mouseActiveTarget = 1;
  }, { passive: true });
  window.addEventListener('pointerleave', function(){ mouseActiveTarget = 0; }, { passive: true });
  document.addEventListener('mouseleave', function(){ mouseActiveTarget = 0; }, { passive: true });

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      resize();
      if (reduceMotion) render(6);
    }, 120);
  });

  resize();

  function boot(){
    if (reduceMotion){
      render(6);
    } else {
      var last = 0;
      var FRAME_MS = 1000 / 22;
      function loop(now){
        requestAnimationFrame(loop);
        if (now - last < FRAME_MS) return;
        last = now;
        mouseSmooth.x += (mouse.x - mouseSmooth.x) * 0.045;
        mouseSmooth.y += (mouse.y - mouseSmooth.y) * 0.045;
        mouseActive += (mouseActiveTarget - mouseActive) * 0.035;
        render(now / 1000);
      }
      requestAnimationFrame(loop);
    }
  }

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(boot);
  } else {
    boot();
  }
})();
</script>

</body></html>
